; GIBox test fixture (written for the GIBox tests, not taken from a MOD): the layout of a merged GIMI Present
; frame-loop animation, four frames, two parts and a face texture. Buffers are not needed by the tests.

[Constants]
global $ActiveCharacter = 0
global $speed = 2
global $frameStart = 0
global $frameEnd = 3
global $swapvar = 0
global $auxTime = 0

[Present]
if $auxTime % $speed == 0
    if $swapvar < $frameEnd
        $swapvar = $swapvar + 1
    else
        $swapvar = $frameStart
    endif
endif
post $auxTime=$auxTime+1

[TextureOverrideHeroPosition]
hash = 11aa0001
run = CommandListHeroPosition
$ActiveCharacter = 1

[TextureOverrideHeroBlend]
hash = 11aa0002
run = CommandListHeroBlend

[TextureOverrideHeroTexcoord]
hash = 11aa0003
run = CommandListHeroTexcoord

[TextureOverrideHeroIB]
hash = 11aa0004
run = CommandListHeroIB

[TextureOverrideHeroHead]
hash = 11aa0004
match_first_index = 0
run = CommandListHeroHead

[TextureOverrideHeroBody]
hash = 11aa0004
match_first_index = 3000
run = CommandListHeroBody

[TextureOverrideHeroFaceHeadDiffuse]
hash = 11aa0005
run = CommandListHeroFaceHeadDiffuse

[CommandListHeroPosition]
if $swapvar == 0
	vb0 = ResourceHeroPosition.0
else if $swapvar == 1
	vb0 = ResourceHeroPosition.1
else if $swapvar == 2
	vb0 = ResourceHeroPosition.2
else if $swapvar == 3
	vb0 = ResourceHeroPosition.3
endif

[CommandListHeroBlend]
if $swapvar == 0
	vb1 = ResourceHeroBlend.0
	handling = skip
	draw = 9000,0
else if $swapvar == 1
	vb1 = ResourceHeroBlend.1
	handling = skip
	draw = 9000,0
else if $swapvar == 2
	vb1 = ResourceHeroBlend.2
	handling = skip
	draw = 9000,0
else if $swapvar == 3
	vb1 = ResourceHeroBlend.3
	handling = skip
	draw = 9000,0
endif

[CommandListHeroTexcoord]
if $swapvar == 0
	vb1 = ResourceHeroTexcoord.0
else if $swapvar == 1
	vb1 = ResourceHeroTexcoord.1
else if $swapvar == 2
	vb1 = ResourceHeroTexcoord.2
else if $swapvar == 3
	vb1 = ResourceHeroTexcoord.3
endif

[CommandListHeroIB]
if $swapvar == 0
	handling = skip
	drawindexed = auto
else if $swapvar == 1
	handling = skip
	drawindexed = auto
else if $swapvar == 2
	handling = skip
	drawindexed = auto
else if $swapvar == 3
	handling = skip
	drawindexed = auto
endif

[CommandListHeroHead]
if $swapvar == 0
	ib = ResourceHeroHeadIB.0
	ps-t0 = ResourceHeroHeadDiffuse.0
	ps-t1 = ResourceHeroHeadLightMap.0
	ps-t2 = ResourceHeroHeadShadowRamp.0
else if $swapvar == 1
	ib = ResourceHeroHeadIB.1
	ps-t0 = ResourceHeroHeadDiffuse.1
	ps-t1 = ResourceHeroHeadLightMap.1
	ps-t2 = ResourceHeroHeadShadowRamp.1
else if $swapvar == 2
	ib = ResourceHeroHeadIB.2
	ps-t0 = ResourceHeroHeadDiffuse.2
	ps-t1 = ResourceHeroHeadLightMap.2
	ps-t2 = ResourceHeroHeadShadowRamp.2
else if $swapvar == 3
	ib = ResourceHeroHeadIB.3
	ps-t0 = ResourceHeroHeadDiffuse.3
	ps-t1 = ResourceHeroHeadLightMap.3
	ps-t2 = ResourceHeroHeadShadowRamp.3
endif

[CommandListHeroBody]
if $swapvar == 0
	ib = ResourceHeroBodyIB.0
	ps-t0 = ResourceHeroBodyDiffuse.0
	ps-t1 = ResourceHeroBodyLightMap.0
	ps-t2 = ResourceHeroBodyMetalMap.0
else if $swapvar == 1
	ib = ResourceHeroBodyIB.1
	ps-t0 = ResourceHeroBodyDiffuse.1
	ps-t1 = ResourceHeroBodyLightMap.1
	ps-t2 = ResourceHeroBodyMetalMap.1
else if $swapvar == 2
	ib = ResourceHeroBodyIB.2
	ps-t0 = ResourceHeroBodyDiffuse.2
	ps-t1 = ResourceHeroBodyLightMap.2
	ps-t2 = ResourceHeroBodyMetalMap.2
else if $swapvar == 3
	ib = ResourceHeroBodyIB.3
	ps-t0 = ResourceHeroBodyDiffuse.3
	ps-t1 = ResourceHeroBodyLightMap.3
	ps-t2 = ResourceHeroBodyMetalMap.3
endif

[CommandListHeroFaceHeadDiffuse]
if $swapvar == 0
	ps-t0 = ResourceHeroFaceHeadDiffuse.0
else if $swapvar == 1
	ps-t0 = ResourceHeroFaceHeadDiffuse.1
else if $swapvar == 2
	ps-t0 = ResourceHeroFaceHeadDiffuse.2
else if $swapvar == 3
	ps-t0 = ResourceHeroFaceHeadDiffuse.3
endif

