; GIBox test fixture (written for the GIBox tests, not taken from a MOD): a two-frame Present loop whose Body part
; draws twice with ranges from a variable in frame 0 and once in frame 1, and a second INI with a [Resource] of the
; same name as the main INI's. The IB section only skips: an IB-level drawindexed = auto would also draw Body
; (3DMigoto matches it for every draw of the hash), which the old converter does not build. Buffers are not needed.
[Constants]
global $speed = 1
global $counter = 0
global $frame = 0
global $first = 0
global $last = 1
global $half = 3
[Present]
if $counter % $speed == 0
if $frame < $last
$frame = $frame + 1
else
$frame = $first
endif
endif
post $counter = $counter + 1
[TextureOverrideHeroPosition]
hash = 11aa0001
vb0 = ResourceHeroPosition
[TextureOverrideHeroBlend]
hash = 11aa0002
vb1 = ResourceHeroBlend
handling = skip
draw = 6,0
[TextureOverrideHeroTexcoord]
hash = 11aa0003
vb1 = ResourceHeroTexcoord
[TextureOverrideHeroIB]
hash = 11aa0004
handling = skip
[TextureOverrideHeroHead]
hash = 11aa0004
match_first_index = 0
ib = ResourceHeroHeadIB
ps-t0 = ResourceHeroDiffuse
drawindexed = auto
[TextureOverrideHeroBody]
hash = 11aa0004
match_first_index = 6
ib = ResourceHeroBodyIB
ps-t0 = ResourceHeroDiffuse
if $frame == 0
drawindexed = $half,0,0
drawindexed = $half,$half,0
else
drawindexed = 6,0,0
endif
[ResourceHeroPosition]
type = Buffer
stride = 40
filename = Position.buf
[ResourceHeroBlend]
type = Buffer
stride = 32
filename = Blend.buf
[ResourceHeroTexcoord]
type = Buffer
stride = 20
filename = Texcoord.buf
[ResourceHeroHeadIB]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Head.ib
[ResourceHeroBodyIB]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Body.ib
[ResourceHeroDiffuse]
filename = textures\Diffuse.dds
