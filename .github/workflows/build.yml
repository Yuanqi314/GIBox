name: Build from source
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default ('tools platform-tools') fails: the legacy 'tools' package no longer exists.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      # compileSdk 37.1 and build-tools are downloaded by AGP (licenses accepted by setup-android).
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: python3 tools/check_source.py && python3 tools/test_host.py
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is empty or not visible to this workflow; building an unsigned-release fallback (debug APK) instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Build debug APK (no signing secrets)
        if: steps.keystore.outputs.signed != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # Upload the APK itself instead of a zip wrapping it (archive: false takes exactly one file).
      - name: Collect APK
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then type=release; else type=debug; fi
          apks=(app/build/outputs/apk/$type/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then echo "::error::expected one APK, found: ${apks[*]}"; exit 1; fi
          out="$RUNNER_TEMP/GIBox-$type-${GITHUB_SHA::7}.apk"
          cp "${apks[0]}" "$out"
          echo "APK_PATH=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_PATH }}
          archive: false
