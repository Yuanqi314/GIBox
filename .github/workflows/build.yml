name: Build from source
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      # compileSdk 37.1 and build-tools are downloaded by AGP (licenses accepted by setup-android).
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: python3 tools/check_source.py && python3 tools/test_host.py
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GIBox-debug
          path: app/build/outputs/apk/debug/*.apk
